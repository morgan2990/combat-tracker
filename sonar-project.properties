sonar.projectKey=morgan2990_combat-tracker
sonar.organization=morgan2990

sonar.sources=.
sonar.exclusions=frontend/node_modules/**,frontend/dist/**,frontend/dist-ssr/**,**/*.exe,**/*_test.go,frontend/**/*.test.ts,frontend/**/*.test.tsx

# Go has no separate test-source directory (tests live alongside
# production code, distinguished only by the _test.go suffix), so unlike
# JS/TS analyzers, which auto-recognize *.test.ts by convention, Go test
# files must be explicitly excluded from sonar.sources above and
# re-declared here as test code — otherwise Sonar treats them as
# uncovered production code and their line count silently drags down
# new_coverage. Setting sonar.test.inclusions overrides the JS/TS
# analyzer's own auto-detection too, so *.test.ts must be listed here
# explicitly as well, not left to be auto-detected.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,frontend/**/*.test.ts,frontend/**/*.test.tsx

sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
