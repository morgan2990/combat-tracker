services:
  combatapp:
    build: .
    container_name: combatapp
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      typesense:
        condition: service_healthy

  mongo:
    image: mongo:latest
    container_name: combatapp-mongo
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: combatapp
    volumes:
      - /mnt/data/mongodb:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /mnt/data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  typesense:
    image: typesense/typesense:29.1-arm64-lg-page16
    container_name: typesense
    restart: unless-stopped
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors'
    volumes:
      - /data/compose/2/typesense-data:/data
    ports:
      - "8108:8108"
    healthcheck:
      # A bare TCP check (the previous test here) only confirms the process
      # is listening, not that Typesense has finished internal startup (Raft
      # leader election) — combatapp's depends_on/service_healthy gate was
      # passing before Typesense's /health endpoint actually returned ok,
      # causing InitTypesense() to see a 503 and permanently disable search
      # for that run. This image has neither curl nor wget, so the /health
      # endpoint is hit via a raw HTTP request over bash's /dev/tcp instead.
      # Uses the exec form with bash named explicitly, not CMD-SHELL — this
      # image's /bin/sh is dash, which has no /dev/tcp support.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && timeout 3 grep -q '\"ok\":true' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - combatapp
